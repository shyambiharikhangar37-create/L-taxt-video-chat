<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BBL Video Chat</title>
    <!-- PeerJS लाइब्रेरी -->
    <script src="https://unpkg.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; height: 100dvh; overflow: hidden; }
        
        /* Auth Styles */
        .auth-container {
            width: 100%; max-width: 420px; height: 100%; background: #fff;
            display: flex; flex-direction: column; padding: 20px; overflow-y: auto;
        }
        .auth-header { text-align: center; padding: 30px 0 20px; }
        .auth-header h1 { color: #1565c0; font-size: 28px; margin-bottom: 8px; }
        .auth-header p { color: #666; font-size: 14px; }
        
        .auth-form { display: flex; flex-direction: column; gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 14px; font-weight: 600; color: #333; }
        .form-group input {
            padding: 12px; border: 1px solid #ddd; border-radius: 8px;
            font-size: 16px; outline: none; transition: 0.2s;
        }
        .form-group input:focus { border-color: #1565c0; box-shadow: 0 0 0 2px rgba(21,101,192,0.1); }
        
        .auth-btn {
            background: #1565c0; color: white; border: none; padding: 14px;
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 5px;
        }
        .auth-btn:disabled { background: #90caf9; cursor: not-allowed; }
        
        .auth-toggle { text-align: center; margin-top: 15px; color: #666; font-size: 14px; }
        .auth-toggle a { color: #1565c0; text-decoration: none; font-weight: 600; cursor: pointer; }
        .auth-toggle a:hover { text-decoration: underline; }
        
        .msg-box { text-align: center; font-size: 13px; min-height: 18px; padding: 5px; border-radius: 5px; }
        .msg-box.error { color: #d32f2f; background: #ffebee; }
        .msg-box.success { color: #2e7d32; background: #e8f5e9; }

        /* Chat Container */
        .chat-container {
            width: 100%; max-width: 600px; height: 100%; background: #fff;
            display: none; flex-direction: column;
        }
        .user-header {
            background: #1565c0; color: white; padding: 12px 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar {
            width: 38px; height: 38px; border-radius: 50%; background: white;
            color: #1565c0; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px;
        }
        .user-details { display: flex; flex-direction: column; }
        .user-name { font-weight: bold; font-size: 15px; }
        .user-phone { font-size: 11px; opacity: 0.85; }
        .logout-btn {
            background: rgba(255,255,255,0.2); color: white; border: none;
            padding: 8px 14px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: 600;
        }
        .logout-btn:hover { background: rgba(255,255,255,0.3); }

        .connection-panel { background: #e3f2fd; padding: 12px 15px; border-bottom: 2px solid #bbdefb; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 13px; font-weight: bold; color: #1565c0; }
        .input-group input {
            padding: 10px; border: 1px solid #90caf9; border-radius: 6px;
            font-size: 16px; outline: none;
        }
        .btn-primary {
            background: #1565c0; color: white; border: none; padding: 12px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; margin-top: 8px;
        }
        .btn-primary:disabled { background: #90caf9; cursor: not-allowed; }
        .status-text { text-align: center; font-size: 13px; color: #d32f2f; font-weight: bold; min-height: 18px; margin-top: 5px; }
        .status-text.connected { color: #2e7d32; }

        .video-section { position: relative; background: #111; width: 100%; aspect-ratio: 4/3; overflow: hidden; }
        .video-box.remote-box { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        .video-box.local-box {
            position: absolute; top: 10px; right: 10px; width: 90px; height: 120px;
            border-radius: 8px; border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10; overflow: hidden; background: #222;
        }
        video { width: 100%; height: 100%; object-fit: cover; background: #222; }
        .video-label {
            position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.6);
            color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 11px; z-index: 12;
        }

        .controls {
            padding: 10px; background: #f8f9fa; border-bottom: 1px solid #ddd;
            display: flex; justify-content: center; gap: 10px;
        }
        #endCallBtn {
            color: white; border: none; padding: 10px 20px; border-radius: 5px;
            cursor: pointer; font-weight: bold; font-size: 14px; display: none; background: #dc3545;
        }

        .text-chat-section { display: flex; flex-direction: column; flex-grow: 1; min-height: 0; background: #fff; }
        .chat-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 12px; max-width: 80%; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .message.system { background: #e9ecef; color: #6c757d; align-self: center; font-style: italic; font-size: 12px; text-align: center; max-width: 90%; }
        .message.you { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message.stranger { background: #e4e6eb; color: black; align-self: flex-start; border-bottom-left-radius: 4px; }
        .input-area { display: flex; padding: 10px; border-top: 1px solid #ddd; gap: 10px; background: #fff; }
        #messageInput { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 15px; }
        #sendBtn { background: #007bff; color: white; border: none; padding: 0 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        #sendBtn:disabled, #messageInput:disabled { background: #cccccc; color: #666; cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- Auth Container -->
    <div class="auth-container" id="authContainer">
        <div class="auth-header">
            <h1>📹 BBL Video Chat</h1>
            <p>सुरक्षित और तेज़ वीडियो कॉलिंग</p>
        </div>

        <!-- Login Form -->
        <div id="loginForm" class="auth-form">
            <div class="form-group">
                <label>फोन नंबर / User ID</label>
                <input type="tel" id="loginPhone" placeholder="अपना फोन नंबर डालें" maxlength="15">
            </div>
            <div class="form-group">
                <label>पासवर्ड</label>
                <input type="password" id="loginPassword" placeholder="अपना पासवर्ड डालें">
            </div>
            <div id="loginMsg" class="msg-box"></div>
            <button class="auth-btn" id="loginBtn" onclick="handleLogin()">लॉगिन करें</button>
            <div class="auth-toggle">
                खाता नहीं है? <a onclick="toggleAuth('signup')">यहाँ साइनअप करें</a>
            </div>
        </div>

        <!-- Signup Form -->
        <div id="signupForm" class="auth-form" style="display: none;">
            <div class="form-group">
                <label>पूरा नाम</label>
                <input type="text" id="signupName" placeholder="अपना नाम डालें" maxlength="50">
            </div>
            <div class="form-group">
                <label>फोन नंबर</label>
                <input type="tel" id="signupPhone" placeholder="अपना फोन नंबर दर्ज करें" maxlength="15">
            </div>
            <div class="form-group">
                <label>पासवर्ड बनायें</label>
                <input type="password" id="signupPassword" placeholder="एक मजबूत पासवर्ड चुनें">
            </div>
            <div id="signupMsg" class="msg-box"></div>
            <button class="auth-btn" id="signupBtn" onclick="handleSignup()">साइनअप करें</button>
            <div class="auth-toggle">
                पहले से खाता है? <a onclick="toggleAuth('login')">यहाँ लॉगिन करें</a>
            </div>
        </div>
    </div>

    <!-- Main Chat Interface -->
    <div class="chat-container" id="chatContainer">
        <div class="user-header">
            <div class="user-info">
                <div class="user-avatar" id="headerAvatar">S</div>
                <div class="user-details">
                    <span class="user-name" id="headerName">Shyambihari Khangar</span>
                    <span class="user-phone" id="headerPhone">6261577705</span>
                </div>
            </div>
            <button class="logout-btn" onclick="handleLogout()">लॉगआउट</button>
        </div>

        <div class="connection-panel">
            <div class="input-group">
                <label>किससे जुड़ना है (उनका फोन नंबर):</label>
                <input type="text" id="remotePeerIdInput" placeholder="सामने वाले का नंबर डालें">
            </div>
            <button class="btn-primary" id="callActionBtn" onclick="startCallProcess()">पुनः प्रयास करें / कॉल करें</button>
            <div class="status-text" id="statusMessage">कैमरा/माइक की अनुमति मांगी जा रही है...</div>
        </div>

        <div class="video-section">
            <div class="video-box remote-box">
